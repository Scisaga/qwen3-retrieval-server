services:
  qwen3_embedding:
    build: .
    container_name: qwen3_embedding_openai
    restart: unless-stopped
    ports:
      - "12302:12302"
    environment:
      MODEL_ID: "Qwen/Qwen3-Embedding-4B"
      # MODEL_REVISION: "main"
      HOST: "0.0.0.0"
      PORT: "12302"
      BACKEND_HOST: "127.0.0.1"
      BACKEND_PORT: "8001"
      TZ: "Asia/Shanghai"
      HF_HOME: "/models"
      DTYPE: "float16"
      # Qwen3-Embedding-4B 在 RTX 2080 Ti (22GB, Turing) 上使用更保守的默认值
      MAX_MODEL_LEN: "8192"
      GPU_MEMORY_UTILIZATION: "0.72"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      DEFAULT_QUERY_INSTRUCTION: "Given a web search query, retrieve relevant passages that answer the query"
      PROJECTOR_CACHE_TTL_SECONDS: "300"
      PROJECTOR_CACHE_MAX_ITEMS: "32"
      PRELOAD_MODEL: "1"
      ADMIN_TOKEN: "change-me"
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      # 默认行为：
      # - 当容器可见多张 GPU 且未显式设置 tensor/pipeline parallel 时，
      #   wrapper 会按“每张卡 1 个 vLLM 实例”启动，并在外层做轮询分发
      # - 如果你只想保留单实例，可设置 AUTO_BACKEND_REPLICAS=0
      # - 如果你明确要让单个 vLLM 实例跨卡切模型，再手动追加 --tensor-parallel-size / --pipeline-parallel-size
      # 2080 Ti / Turing 上优先避免长时间卡在 startup：
      # - --enforce-eager: 关闭 CUDA graph
      # - --disable-frontend-multiprocessing: 降低前后端分离复杂度
      # - --max-num-seqs / --max-num-batched-tokens: 缩小调度窗口，但 batched tokens 不能小于 max_model_len
      # - --hf_overrides '{"is_matryoshka": true}': 让 Qwen3-Embedding-* 在 vLLM 中正确接受 dimensions 参数
      VLLM_EXTRA_ARGS: "--enforce-eager --disable-frontend-multiprocessing --max-num-seqs 24 --max-num-batched-tokens 16384 --disable-custom-all-reduce --hf_overrides '{\"is_matryoshka\": true}'"
    volumes:
      - ./models:/models
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # 选卡：宿主机第 1 张卡写 "0"，第 2 张卡写 "1"
              # 如果这里写 ["0","1"]，默认会在两张卡上各起 1 个 vLLM 实例并支持并发推理
              device_ids: ["0"]
              capabilities: [gpu]
