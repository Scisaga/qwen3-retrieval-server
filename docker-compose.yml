name: qwen3-retrieval-server

services:
  qwen3_retrieval:
    build: .
    image: qwen3-retrieval-server:local
    container_name: qwen3_retrieval_server
    restart: unless-stopped
    ports:
      - "12302:12302"
    environment:
      MODEL_ID: "Qwen/Qwen3-Embedding-4B"
      # MODEL_REVISION: "main"
      HOST: "0.0.0.0"
      PORT: "12302"
      BACKEND_HOST: "127.0.0.1"
      BACKEND_PORT: "8001"
      TZ: "Asia/Shanghai"
      HF_HOME: "/models"
      DTYPE: "float16"
      # Qwen3-Embedding-4B 在 RTX 2080 Ti (22GB, Turing) 上使用更保守的默认值
      MAX_MODEL_LEN: "8192"
      # vLLM 0.19.1 treats this as a reservation target. 0.47 retains the
      # 8192-token KV cache while leaving room for ASR and the capped Reranker.
      GPU_MEMORY_UTILIZATION: "0.47"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      DEFAULT_QUERY_INSTRUCTION: "Given a web search query, retrieve relevant passages that answer the query"
      PROJECTOR_CACHE_TTL_SECONDS: "300"
      PROJECTOR_CACHE_MAX_ITEMS: "32"
      PRELOAD_MODEL: "1"
      AUTO_BACKEND_REPLICAS: "0"
      RERANKER_MODEL_ID: "Qwen/Qwen3-Reranker-0.6B"
      # RERANKER_MODEL_REVISION: "main"
      RERANKER_BACKEND_HOST: "127.0.0.1"
      RERANKER_BACKEND_PORT: "8002"
      RERANKER_DTYPE: "float16"
      RERANKER_MAX_MODEL_LEN: "2048"
      # FP16 先按计划使用 0.08；仅启动失败时尝试 0.085。
      # BitsAndBytes 单独收紧到 GPU 0 实测通过 2 GiB 门槛的 0.06。
      RERANKER_GPU_MEMORY_UTILIZATION: "0.08"
      RERANKER_FALLBACK_GPU_MEMORY_UTILIZATION: "0.085"
      RERANKER_QUANTIZED_GPU_MEMORY_UTILIZATION: "0.06"
      RERANKER_START_TIMEOUT: "300"
      # 共享 GPU 上其他进程在 vLLM profiling 期间释放显存时，按同配置重试一次。
      RERANKER_PRELOAD_RETRY_DELAY: "5"
      # FP16 峰值超过 2 GiB；4-bit 在 0.0121 质量下降上限内通过发布门禁。
      RERANKER_QUANTIZATION: "bitsandbytes"
      RERANKER_PRELOAD: "1"
      RERANKER_AUTO_FALLBACK_4BIT: "1"
      ADMIN_TOKEN: "change-me"
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      # 容器只暴露 GPU 0；Embedding 与 Reranker 各一个独立 vLLM 进程。
      # 2080 Ti / Turing 上优先避免长时间卡在 startup：
      # - --enforce-eager: 关闭 CUDA graph
      # - --max-num-seqs / --max-num-batched-tokens: 缩小调度窗口，但 batched tokens 不能小于 max_model_len
      # - --hf_overrides '{"is_matryoshka": true}': 让 Qwen3-Embedding-* 在 vLLM 中正确接受 dimensions 参数
      VLLM_EXTRA_ARGS: "--enforce-eager --max-num-seqs 24 --max-num-batched-tokens 16384 --disable-custom-all-reduce --hf-overrides '{\"is_matryoshka\": true}'"
    volumes:
      - ./models:/models
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # GPU 1 保留给其他用途，禁止在此处增加。
              device_ids: ["0"]
              capabilities: [gpu]
