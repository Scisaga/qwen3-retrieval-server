name: delete-legacy-ghcr-package

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete legacy GHCR package
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/users/${OWNER}/packages/container/qwen3-embedding-openai")
          if [ "${status}" != '204' ] && [ "${status}" != '404' ]; then
            echo "Legacy package deletion failed with HTTP ${status}."
            python -m json.tool response.json || true
            exit 1
          fi
          echo "Legacy package deletion returned HTTP ${status}."
